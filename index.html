```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmongusChat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background-color: #000;
            color: #ff0000;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        #particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #ff4444;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        
        .chat-box {
            width: 80%;
            max-width: 600px;
            height: 70vh;
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            width: 80%;
            max-width: 600px;
            gap: 10px;
        }
        
        input {
            flex-grow: 1;
            padding: 10px;
            background-color: #111;
            color: #ff0000;
            border: 1px solid #ff0000;
            border-radius: 5px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #ff0000;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background-color: #cc0000;
        }
        
        .message {
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        
        .username {
            font-weight: bold;
            color: #ff5555;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    
    <div class="container" id="name-container">
        <h1>AmongusChat</h1>
        <div class="input-group">
            <input type="text" id="username-input" placeholder="Enter your name...">
            <button id="submit-name">Enter</button>
        </div>
    </div>
    
    <div class="container hidden" id="chat-container">
        <div class="chat-box" id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        // Particles system
        const particles = [];
        const particleCount = 100;
        const particleCanvas = document.getElementById('particles');
        
        // Create particles
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.dataset.x = parseFloat(particle.style.left);
            particle.dataset.y = parseFloat(particle.style.top);
            particle.dataset.vx = Math.random() * 0.2 - 0.1;
            particle.dataset.vy = Math.random() * 0.2 - 0.1;
            particleCanvas.appendChild(particle);
            particles.push(particle);
        }
        
        // Mouse position
        let mouseX = 0;
        let mouseY = 0;
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        // Particle animation
        function animateParticles() {
            particles.forEach(particle => {
                let x = parseFloat(particle.dataset.x);
                let y = parseFloat(particle.dataset.y);
                let vx = parseFloat(particle.dataset.vx);
                let vy = parseFloat(particle.dataset.vy);
                
                // Mouse repulsion
                const dx = mouseX - x * window.innerWidth / 100;
                const dy = mouseY - y * window.innerHeight / 100;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150) {
                    const force = (150 - dist) / 30;
                    const angle = Math.atan2(dy, dx);
                    vx -= Math.cos(angle) * force * 0.05;
                    vy -= Math.sin(angle) * force * 0.05;
                }
                
                // Update position
                x += vx;
                y += vy;
                
                // Bounce off walls
                if (x < 0 || x > 100) {
                    vx *= -0.8;
                    x = x < 0 ? 0 : 100;
                }
                if (y < 0 || y > 100) {
                    vy *= -0.8;
                    y = y < 0 ? 0 : 100;
                }
                
                // Apply friction
                vx *= 0.98;
                vy *= 0.98;
                
                // Update particle
                particle.style.left = `${x}%`;
                particle.style.top = `${y}%`;
                particle.dataset.x = x;
                particle.dataset.y = y;
                particle.dataset.vx = vx;
                particle.dataset.vy = vy;
            });
            
            // Connect particles
            const lines = document.querySelectorAll('.particle-line');
            lines.forEach(line => line.remove());
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    
                    const x1 = parseFloat(p1.dataset.x) * window.innerWidth / 100;
                    const y1 = parseFloat(p1.dataset.y) * window.innerHeight / 100;
                    const x2 = parseFloat(p2.dataset.x) * window.innerWidth / 100;
                    const y2 = parseFloat(p2.dataset.y) * window.innerHeight / 100;
                    
                    const distance = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                    
                    if (distance < 150) {
                        const line = document.createElement('div');
                        line.className = 'particle-line';
                        line.style.position = 'absolute';
                        line.style.left = `${x1}px`;
                        line.style.top = `${y1}px`;
                        line.style.width = `${distance}px`;
                        line.style.height = '1px';
                        line.style.backgroundColor = `rgba(255, ${Math.floor(100 - distance)}, ${Math.floor(100 - distance)}, ${0.5 - distance/300})`;
                        line.style.transformOrigin = '0 0';
                        line.style.transform = `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`;
                        line.style.pointerEvents = 'none';
                        particleCanvas.appendChild(line);
                    }
                }
            }
            
            requestAnimationFrame(animateParticles);
        }
        
        animateParticles();
        
        // Chat functionality
        let username = '';
        
        document.getElementById('submit-name').addEventListener('click', () => {
            username = document.getElementById('username-input').value.trim();
            if (username) {
                document.getElementById('name-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('message-input').focus();
                
                // Add welcome message
                const welcomeMessage = document.createElement('div');
                welcomeMessage.className = 'message';
                welcomeMessage.innerHTML = `<span class="username">System:</span> Welcome to AmongusChat, ${username}!`;
                document.getElementById('chat-box').appendChild(welcomeMessage);
            }
        });
        
        document.getElementById('send-button').addEventListener('click', sendMessage);
        
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            
            if (message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
                messageElement.innerHTML = `<span class="username">${username}:</span> ${message}`;
                document.getElementById('chat-box').appendChild(messageElement);
                messageInput.value = '';
                
                // Scroll to bottom
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            }
        }
    </script>
</body>
</html>
