<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmongUs Chat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #ff4444;
            border-radius: 50%;
            pointer-events: none;
        }

        .particle-line {
            position: absolute;
            height: 1px;
            background-color: rgba(255, 0, 0, 0.3);
            transform-origin: left;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 20px;
        }

        #auth-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        #chat-form {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        input, button {
            padding: 10px;
            background-color: #111;
            color: #ff0000;
            border: 1px solid #ff0000;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background-color: #ff0000;
            color: #000;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #ff0000;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .message {
            margin-bottom: 10px;
            padding: 5px;
            border-bottom: 1px dashed #ff0000;
        }

        .username {
            font-weight: bold;
            color: #ff5555;
        }

        #status {
            text-align: center;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <h1>AMONGUS CHAT</h1>
        <div id="status">Connecting...</div>
        
        <div id="auth-container">
            <form id="auth-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="login-btn">Login</button>
                <button type="button" id="register-btn">Register</button>
            </form>
        </div>

        <div id="chat-container" style="display: none;">
            <!-- Messages will appear here -->
        </div>

        <form id="chat-form" style="display: none;">
            <input type="text" id="message-input" placeholder="Type your message..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // Particle system
        const particles = [];
        const particleLines = [];
        const particleCount = 100;
        const maxDistance = 150;
        
        function initParticles() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random initial position
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                // Random velocity
                const vx = (Math.random() - 0.5) * 0.5;
                const vy = (Math.random() - 0.5) * 0.5;
                
                particles.push({
                    element: particle,
                    x, y, vx, vy
                });
                
                particlesContainer.appendChild(particle);
            }
            
            // Create some particle lines (they'll be reused)
            for (let i = 0; i < particleCount * 5; i++) {
                const line = document.createElement('div');
                line.className = 'particle-line';
                line.style.display = 'none';
                particlesContainer.appendChild(line);
                particleLines.push(line);
            }
            
            animateParticles();
        }
        
        function animateParticles() {
            const mouseX = window.mouseX || window.innerWidth / 2;
            const mouseY = window.mouseY || window.innerHeight / 2;
            
            particles.forEach((p, i) => {
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                
                // Bounce off edges
                if (p.x < 0 || p.x > window.innerWidth) p.vx *= -1;
                if (p.y < 0 || p.y > window.innerHeight) p.vy *= -1;
                
                // Move away from mouse
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100 * 0.5;
                    p.vx += dx / distance * force;
                    p.vy += dy / distance * force;
                }
                
                // Apply position
                p.element.style.left = `${p.x}px`;
                p.element.style.top = `${p.y}px`;
                
                // Limit velocity
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > 2) {
                    p.vx = p.vx / speed * 2;
                    p.vy = p.vy / speed * 2;
                }
            });
            
            // Draw connections between particles
            let lineIndex = 0;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < maxDistance) {
                        const opacity = 1 - distance / maxDistance;
                        
                        if (lineIndex >= particleLines.length) break;
                        
                        const line = particleLines[lineIndex];
                        line.style.display = 'block';
                        line.style.left = `${p1.x}px`;
                        line.style.top = `${p1.y}px`;
                        line.style.width = `${distance}px`;
                        line.style.opacity = opacity;
                        
                        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                        line.style.transform = `rotate(${angle}deg)`;
                        
                        lineIndex++;
                    }
                }
            }
            
            // Hide remaining lines
            for (let i = lineIndex; i < particleLines.length; i++) {
                particleLines[i].style.display = 'none';
            }
            
            requestAnimationFrame(animateParticles);
        }
        
        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            window.mouseX = e.clientX;
            window.mouseY = e.clientY;
        });
        
        // Chat functionality
        let socket;
        let currentUser = null;
        
        function connectWebSocket() {
            // In a real app, this would connect to your WebSocket server
            // For this demo, we'll simulate it with setTimeout
            
            setTimeout(() => {
                document.getElementById('status').textContent = 'Connected';
                
                // Show login form if not logged in
                const authToken = localStorage.getItem('authToken');
                if (authToken) {
                    // Simulate auto-login
                    currentUser = JSON.parse(localStorage.getItem('userData'));
                    showChat();
                }
            }, 1000);
        }
        
        function showChat() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('chat-form').style.display = 'flex';
            
            // Load last week's messages (simulated)
            const messages = JSON.parse(localStorage.getItem('messages')) || [];
            messages.forEach(msg => {
                addMessageToChat(msg);
            });
        }
        
        function addMessageToChat(message) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.innerHTML = `<span class="username">${message.username}:</span> ${message.text}`;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simulate login
            setTimeout(() => {
                currentUser = { username };
                localStorage.setItem('userData', JSON.stringify(currentUser));
                localStorage.setItem('authToken', 'simulated-token');
                showChat();
            }, 500);
        });
        
        document.getElementById('register-btn').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('Please enter both username and password');
                return;
            }
            
            // Check if username exists (simulated)
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[username]) {
                alert('Username already exists');
                return;
            }
            
            // Register new user (simulated)
            users[username] = { password };
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('Registration successful! You can now login');
        });
        
        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (message && currentUser) {
                const chatMessage = {
                    username: currentUser.username,
                    text: message,
                    timestamp: new Date().toISOString()
                };
                
                // Save message (simulated)
                const messages = JSON.parse(localStorage.getItem('messages')) || [];
                messages.push(chatMessage);
                
                // Keep only last week's messages (simulated)
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                
                const filteredMessages = messages.filter(msg => {
                    return new Date(msg.timestamp) > oneWeekAgo;
                });
                
                localStorage.setItem('messages', JSON.stringify(filteredMessages));
                
                addMessageToChat(chatMessage);
                input.value = '';
            }
        });
        
        // Initialize
        window.addEventListener('load', () => {
            initParticles();
            connectWebSocket();
        });
    </script>
</body>
</html>
```
