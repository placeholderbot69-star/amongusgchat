<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmongusChat - Global Real-Time Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }

    .stars {
      position: absolute;
      width: 1px; height: 1px;
      background: transparent;
      box-shadow: 247px 94px #fff, 89px 158px #fff, 456px 287px #fff, 234px 412px #fff, 678px 123px #fff, 123px 456px #fff, 345px 234px #fff, 567px 89px #fff, 890px 345px #fff, 45px 678px #fff, 234px 567px #fff, 456px 890px #fff, 789px 234px #fff, 12px 567px #fff, 345px 789px #fff, 678px 12px #fff, 90px 345px #fff, 567px 456px #fff, 123px 789px #fff, 890px 567px #fff;
      animation: stars 4s linear infinite;
    }
    .stars2 {
      position: absolute;
      width: 2px; height: 2px;
      background: transparent;
      box-shadow: 178px 312px #fff, 456px 89px #fff, 234px 567px #fff, 789px 123px #fff, 345px 678px #fff, 567px 234px #fff, 89px 890px #fff, 678px 456px #fff, 123px 345px #fff, 890px 789px #fff, 456px 12px #fff, 234px 90px #fff;
      animation: stars 6s linear infinite;
    }
    .stars3 {
      position: absolute;
      width: 1px; height: 1px;
      background: transparent;
      box-shadow: 312px 178px #fff, 89px 456px #fff, 567px 234px #fff, 123px 789px #fff, 678px 345px #fff, 234px 567px #fff, 890px 89px #fff, 456px 678px #fff;
      animation: stars 8s linear infinite;
    }
    @keyframes stars { from { transform: translateY(0); } to { transform: translateY(-100vh); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .animate-scaleIn { animation: scaleIn 0.2s ease-out forwards; }
    .animate-pulse-slow { animation: pulse 2s ease-in-out infinite; }
    .animate-bounce-slow { animation: bounce 1s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

    // ============ UTILITIES ============
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function getTimeRemaining(expiresAt) {
      const now = Date.now();
      const remaining = expiresAt - now;
      if (remaining <= 0) return 'expired';
      const hours = Math.floor(remaining / (1000 * 60 * 60));
      const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
      if (hours > 0) return `${hours}h ${minutes}m`;
      return `${minutes}m`;
    }

    function generateId() {
      return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
    }

    // ============ AUTH CONTEXT ============
    const AuthContext = createContext();

    function getStoredUsers() {
      const stored = localStorage.getItem('chatUsers');
      return stored ? JSON.parse(stored) : {};
    }

    function saveStoredUsers(users) {
      localStorage.setItem('chatUsers', JSON.stringify(users));
    }

    function AuthProvider({ children }) {
      const [currentUser, setCurrentUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      useEffect(() => {
        const savedUser = localStorage.getItem('chatUser');
        if (savedUser) {
          const user = JSON.parse(savedUser);
          setCurrentUser(user.username);
          setIsLoggedIn(true);
        }
      }, []);

      const login = useCallback(async (username, password) => {
        return new Promise((resolve) => {
          setTimeout(() => {
            const users = getStoredUsers();
            const user = users[username.toLowerCase()];
            if (!user) {
              resolve({ success: false, error: 'Account not found. Please sign up first.' });
              return;
            }
            if (user.isAnonymous) {
              resolve({ success: false, error: 'This account was created as quick join. Please sign up with a password.' });
              return;
            }
            if (user.password !== password) {
              resolve({ success: false, error: 'Incorrect password. Please try again.' });
              return;
            }
            const userSession = { username: user.username, isAnonymous: false };
            localStorage.setItem('chatUser', JSON.stringify(userSession));
            setCurrentUser(user.username);
            setIsLoggedIn(true);
            resolve({ success: true });
          }, 500);
        });
      }, []);

      const signup = useCallback(async (username, password) => {
        return new Promise((resolve) => {
          setTimeout(() => {
            if (password.length < 4) {
              resolve({ success: false, error: 'Password must be at least 4 characters.' });
              return;
            }
            const users = getStoredUsers();
            const normalizedUsername = username.toLowerCase();
            if (users[normalizedUsername]) {
              resolve({ success: false, error: 'Username already taken. Please choose another.' });
              return;
            }
            users[normalizedUsername] = { username, password, isAnonymous: false };
            saveStoredUsers(users);
            const userSession = { username, isAnonymous: false };
            localStorage.setItem('chatUser', JSON.stringify(userSession));
            setCurrentUser(username);
            setIsLoggedIn(true);
            resolve({ success: true });
          }, 500);
        });
      }, []);

      const logout = useCallback(() => {
        localStorage.removeItem('chatUser');
        setCurrentUser(null);
        setIsLoggedIn(false);
      }, []);

      const joinAsAnonymous = useCallback((username) => {
        const userSession = { username, isAnonymous: true };
        localStorage.setItem('chatUser', JSON.stringify(userSession));
        setCurrentUser(username);
        setIsLoggedIn(true);
      }, []);

      return (
        <AuthContext.Provider value={{ currentUser, isLoggedIn, login, signup, logout, joinAsAnonymous }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useAuth() {
      return useContext(AuthContext);
    }

    // ============ LOGIN MODAL ============
    function LoginModal({ isOpen, onClose }) {
      const { login, signup, joinAsAnonymous } = useAuth();
      const [mode, setMode] = useState('login');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setError('');
          setUsername('');
          setPassword('');
        }
      }, [isOpen]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!username.trim()) {
          setError('Please enter a username');
          return;
        }
        if (mode !== 'anonymous' && !password.trim()) {
          setError('Please enter a password');
          return;
        }
        if (username.length < 3) {
          setError('Username must be at least 3 characters');
          return;
        }
        setIsLoading(true);
        try {
          if (mode === 'anonymous') {
            joinAsAnonymous(username.trim());
            onClose();
          } else if (mode === 'login') {
            const result = await login(username.trim(), password);
            if (result.success) onClose();
            else setError(result.error || 'Login failed');
          } else {
            const result = await signup(username.trim(), password);
            if (result.success) onClose();
            else setError(result.error || 'Signup failed');
          }
        } catch {
          setError('Something went wrong. Please try again.');
        } finally {
          setIsLoading(false);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
          <div className="relative w-full max-w-md bg-slate-900/95 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl animate-scaleIn">
            <div className="flex items-center justify-between p-6 border-b border-slate-700/50">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center">
                  <span className="text-lg">🛸</span>
                </div>
                <div>
                  <h2 className="text-white font-bold text-lg">Join AmongusChat</h2>
                  <p className="text-slate-400 text-sm">Connect with players worldwide</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>

            <div className="flex border-b border-slate-700/50">
              {['login', 'signup', 'anonymous'].map((m) => (
                <button key={m}
                  onClick={() => { setMode(m); setError(''); }}
                  className={`flex-1 py-3 text-sm font-medium transition-colors ${mode === m ? 'text-white border-b-2 border-red-500' : 'text-slate-500 hover:text-slate-300'}`}
                >
                  {m === 'login' ? 'Login' : m === 'signup' ? 'Sign Up' : 'Quick Join'}
                </button>
              ))}
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-300 mb-2">Username</label>
                <div className="relative">
                  <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                  <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Enter your username"
                    className="w-full pl-11 pr-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-red-500/50 transition-colors" autoFocus />
                </div>
              </div>

              {mode !== 'anonymous' && (
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Password</label>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Enter your password"
                    className="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-red-500/50 transition-colors" />
                </div>
              )}

              {mode === 'anonymous' && (
                <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl">
                  <p className="text-amber-400 text-xs">⚠️ Quick join lets you chat immediately. Your messages won't be linked to an account.</p>
                </div>
              )}

              {error && (
                <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-xl">
                  <p className="text-red-400 text-sm">{error}</p>
                </div>
              )}

              <button type="submit" disabled={isLoading}
                className="w-full py-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold rounded-xl transition-all transform active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                {isLoading ? (
                  <><svg className="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" /><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" /></svg><span>Please wait...</span></>
                ) : (
                  <span>{mode === 'login' ? 'Login' : mode === 'signup' ? 'Create Account' : 'Start Chatting'}</span>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============ MESSAGE LIST ============
    function MessageList({ messages, currentUser, onEditMessage, onDeleteMessage }) {
      const scrollRef = useRef(null);
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState('');

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages]);

      const handleSaveEdit = () => {
        if (editingId && editText.trim()) {
          onEditMessage(editingId, editText.trim());
          setEditingId(null);
          setEditText('');
        }
      };

      const activeMessages = messages.filter(msg => msg.expiresAt > Date.now());

      return (
        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
          {activeMessages.length === 0 ? (
            <div className="flex flex-col items-center justify-center h-full text-center">
              <div className="w-20 h-20 rounded-full bg-slate-800/50 flex items-center justify-center mb-4">
                <svg className="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              </div>
              <p className="text-slate-500 text-lg font-medium">No messages yet</p>
              <p className="text-slate-600 text-sm mt-1">Be the first to say something!</p>
            </div>
          ) : (
            activeMessages.map((message) => {
              const isOwn = message.sender === currentUser;
              const isEditing = editingId === message.id;
              const timeLeft = getTimeRemaining(message.expiresAt);

              return (
                <div key={message.id} className={`flex ${isOwn ? 'justify-end' : 'justify-start'} animate-fadeIn`}>
                  <div className={`max-w-[75%] rounded-2xl px-4 py-3 ${isOwn ? 'bg-gradient-to-br from-red-600 to-red-700 text-white rounded-br-md' : 'bg-slate-800/80 text-slate-100 rounded-bl-md'}`}>
                    {!isOwn && <p className={`text-xs font-semibold mb-1 ${isOwn ? 'text-red-200' : 'text-red-400'}`}>{message.sender}</p>}
                    
                    {isEditing ? (
                      <div className="space-y-2">
                        <input type="text" value={editText} onChange={(e) => setEditText(e.target.value)}
                          className="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-white/40"
                          autoFocus onKeyDown={(e) => { if (e.key === 'Enter') handleSaveEdit(); if (e.key === 'Escape') { setEditingId(null); setEditText(''); } }} />
                        <div className="flex gap-2">
                          <button onClick={handleSaveEdit} className="px-3 py-1 bg-green-500 hover:bg-green-400 text-white text-xs font-medium rounded-lg transition-colors">Save</button>
                          <button onClick={() => { setEditingId(null); setEditText(''); }} className="px-3 py-1 bg-slate-600 hover:bg-slate-500 text-white text-xs font-medium rounded-lg transition-colors">Cancel</button>
                        </div>
                      </div>
                    ) : (
                      <>
                        <p className="text-sm leading-relaxed break-words">{message.text}</p>
                        <div className={`flex items-center gap-2 mt-1.5 ${isOwn ? 'justify-end' : ''}`}>
                          <span className={`text-xs ${isOwn ? 'text-red-200' : 'text-slate-400'}`}>{formatTime(message.timestamp)}</span>
                          {message.isEdited && <span className={`text-xs ${isOwn ? 'text-red-200' : 'text-slate-500'}`}>(edited)</span>}
                          <span className={`text-xs ${isOwn ? 'text-red-200' : 'text-slate-500'}`}>⏱ {timeLeft}</span>
                          {isOwn && (
                            <div className="flex items-center gap-1 ml-2">
                              <button onClick={() => { setEditingId(message.id); setEditText(message.text); }}
                                className="p-1 hover:bg-white/10 rounded transition-colors" title="Edit message">
                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                              </button>
                              <button onClick={() => onDeleteMessage(message.id)} className="p-1 hover:bg-white/10 rounded transition-colors" title="Delete message">
                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                              </button>
                            </div>
                          )}
                        </div>
                      </>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      );
    }

    // ============ MESSAGE INPUT ============
    function MessageInput({ onSendMessage, disabled }) {
      const [text, setText] = useState('');
      const [isSending, setIsSending] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => {
        inputRef.current?.focus();
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        const trimmedText = text.trim();
        if (!trimmedText || disabled || isSending) return;
        setIsSending(true);
        setText('');
        try {
          onSendMessage(trimmedText);
        } finally {
          setIsSending(false);
          inputRef.current?.focus();
        }
      };

      return (
        <form onSubmit={handleSubmit} className="p-4 border-t border-slate-700/50">
          <div className="flex items-center gap-3">
            <input ref={inputRef} type="text" value={text} onChange={(e) => setText(e.target.value)} placeholder="Type a message..."
              maxLength={500} disabled={disabled || isSending}
              className="flex-1 px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-red-500/50 transition-colors disabled:opacity-50" />
            <button type="submit" disabled={!text.trim() || disabled || isSending}
              className="p-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white rounded-xl transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
              {isSending ? (
                <svg className="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" /><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" /></svg>
              ) : (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
              )}
            </button>
          </div>
          <div className="flex justify-between mt-2 text-xs text-slate-500">
            <span>{text.length}/500 characters</span>
            <span>Messages expire in 24 hours</span>
          </div>
        </form>
      );
    }

    // ============ CHAT ROOM ============
    function ChatRoom({ messages, currentUser, onSendMessage, onEditMessage, onDeleteMessage }) {
      const [onlineCount] = useState(Math.floor(Math.random() * 50) + 10);

      return (
        <div className="flex-1 flex flex-col max-w-4xl mx-auto w-full">
          <div className="flex items-center justify-between px-6 py-3 bg-slate-900/50 border-b border-slate-700/50">
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2">
                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse" />
                <span className="text-sm text-slate-400">{onlineCount} online</span>
              </div>
              <span className="text-slate-600">•</span>
              <span className="text-sm text-slate-500">Global Chat</span>
            </div>
            <div className="flex items-center gap-2 text-xs text-slate-500">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <span>Messages expire in 24h</span>
            </div>
          </div>

          <MessageList messages={messages} currentUser={currentUser} onEditMessage={onEditMessage} onDeleteMessage={onDeleteMessage} />
          <MessageInput onSendMessage={onSendMessage} />
        </div>
      );
    }

    // ============ SOURCE CODE MODAL ============
    function SourceCodeModal({ isOpen, onClose }) {
      const [copied, setCopied] = useState(false);

      const fullCode = document.querySelector('script[type="text/babel"]')?.textContent || '';

      const handleCopy = () => {
        navigator.clipboard.writeText(fullCode).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
          <div className="relative w-full max-w-4xl h-[80vh] bg-slate-900/95 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl animate-scaleIn flex flex-col">
            <div className="flex items-center justify-between p-4 border-b border-slate-700/50">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
                </div>
                <div>
                  <h2 className="text-white font-bold">Source Code</h2>
                  <p className="text-slate-400 text-xs">Complete application code</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={handleCopy}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition-all flex items-center gap-2 text-sm">
                  {copied ? (
                    <><svg className="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>Copied!</>
                  ) : (
                    <><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>Copy Code</>
                  )}
                </button>
                <button onClick={onClose} className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
              </div>
            </div>
            <div className="flex-1 overflow-auto p-4 custom-scrollbar">
              <pre className="text-xs text-slate-300 whitespace-pre-wrap font-mono leading-relaxed">{fullCode}</pre>
            </div>
          </div>
        </div>
      );
    }

    // ============ MAIN APP ============
    function AppContent() {
      const { currentUser, isLoggedIn, logout } = useAuth();
      const [messages, setMessages] = useState([]);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isSourceOpen, setIsSourceOpen] = useState(false);

      useEffect(() => {
        if (!isLoggedIn) setIsLoginOpen(true);
      }, [isLoggedIn]);

      useEffect(() => {
        const saved = localStorage.getItem('chatMessages');
        if (saved) setMessages(JSON.parse(saved));
      }, []);

      useEffect(() => {
        if (messages.length > 0) localStorage.setItem('chatMessages', JSON.stringify(messages));
      }, [messages]);

      const handleSendMessage = useCallback((text) => {
        if (!currentUser) return;
        const newMessage = {
          id: generateId(),
          text,
          sender: currentUser,
          timestamp: Date.now(),
          isEdited: false,
          expiresAt: Date.now() + 24 * 60 * 60 * 1000,
        };
        setMessages(prev => [...prev, newMessage]);
      }, [currentUser]);

      const handleEditMessage = useCallback((messageId, newText) => {
        setMessages(prev => prev.map(msg => msg.id === messageId ? { ...msg, text: newText, isEdited: true } : msg));
      }, []);

      const handleDeleteMessage = useCallback((messageId) => {
        setMessages(prev => prev.filter(msg => msg.id !== messageId));
      }, []);

      return (
        <div className="min-h-screen bg-slate-950 text-white relative overflow-hidden">
          <div className="stars" />
          <div className="stars2" />
          <div className="stars3" />
          
          <div className="relative z-10 flex flex-col h-screen">
            <header className="flex items-center justify-between px-6 py-4 border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-xl">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center animate-pulse-slow">
                  <span className="text-lg">🛸</span>
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-red-400 to-red-600 bg-clip-text text-transparent">AmongusChat</h1>
                  <p className="text-xs text-slate-500">Global Real-Time Chat</p>
                </div>
              </div>
              
              <div className="flex items-center gap-3">
                <button onClick={() => setIsSourceOpen(true)}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition-all flex items-center gap-2">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
                  <span className="hidden sm:inline">View Source</span>
                </button>
                
                {isLoggedIn && currentUser && (
                  <div className="flex items-center gap-3">
                    <span className="text-sm text-slate-400">Logged in as <span className="text-white font-medium">{currentUser}</span></span>
                    <button onClick={logout} className="px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg transition-all text-sm">Logout</button>
                  </div>
                )}
              </div>
            </header>

            {isLoggedIn ? (
              <ChatRoom messages={messages} currentUser={currentUser} onSendMessage={handleSendMessage} onEditMessage={handleEditMessage} onDeleteMessage={handleDeleteMessage} />
            ) : (
              <div className="flex-1 flex items-center justify-center">
                <div className="text-center">
                  <div className="w-16 h-16 rounded-full bg-slate-800/50 flex items-center justify-center mx-auto mb-4 animate-bounce-slow">
                    <span className="text-3xl">🛸</span>
                  </div>
                  <p className="text-slate-500">Please login to chat</p>
                </div>
              </div>
            )}
          </div>

          <LoginModal isOpen={isLoginOpen && !isLoggedIn} onClose={() => setIsLoginOpen(false)} />
          <SourceCodeModal isOpen={isSourceOpen} onClose={() => setIsSourceOpen(false)} />
        </div>
      );
    }

    function App() {
      return (
        <AuthProvider>
          <AppContent />
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
